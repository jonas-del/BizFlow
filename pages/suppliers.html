<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers | BizFlow</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="protected">
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="brand">
                    <span class="brand-mark">B</span>
                    <span class="brand-name">BizFlow</span>
                </a>
                <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close navigation">×</button>
            </div>
            <nav class="sidebar-nav" aria-label="Main navigation">
                <div class="nav-section">
                    <span class="nav-section-title">MAIN</span>
                    <a href="dashboard.html" class="nav-item"><span class="nav-icon">▦</span><span>Dashboard</span></a>
                    <a href="sales.html" class="nav-item"><span class="nav-icon">↗</span><span>Sales</span></a>
                    <a href="products.html" class="nav-item"><span class="nav-icon">▣</span><span>Products</span></a>
                    <a href="inventory.html" class="nav-item"><span class="nav-icon">▤</span><span>Inventory</span></a>
                </div>
                <div class="nav-section">
                    <span class="nav-section-title">MANAGEMENT</span>
                    <a href="customers.html" class="nav-item"><span class="nav-icon">👥</span><span>Customers</span></a>
                    <a href="suppliers.html" class="nav-item active"><span class="nav-icon">▨</span><span>Suppliers</span></a>
                    <a href="expenses.html" class="nav-item"><span class="nav-icon">↘</span><span>Expenses</span></a>
                </div>
                <div class="nav-section">
                    <span class="nav-section-title">INSIGHTS</span>
                    <a href="reports.html" class="nav-item"><span class="nav-icon">▥</span><span>Reports</span></a>
                    <a href="settings.html" class="nav-item"><span class="nav-icon">⚙</span><span>Settings</span></a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="eyebrow">SUPPLIER NETWORK</p>
                    <h1>Suppliers</h1>
                </div>
                <div class="topbar-actions">
                    <button type="button" class="button primary" data-add-supplier>Add Supplier</button>
                </div>
            </header>

            <section class="panel">
                <div class="panel-header">
                    <h2>Supplier directory</h2>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Address</th>
                            </tr>
                        </thead>
                        <tbody id="suppliersTableBody">
                            <tr><td colspan="4" class="table-empty">No suppliers added yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/module-actions.js"></script>
    <script src="../js/suppliers.js"></script>
</body>
</html>
